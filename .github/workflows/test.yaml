name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq openssl apache2-utils python3-bcrypt shellcheck
      - name: Shell syntax
        run: for file in *.sh lib/*.sh tests/*.sh; do sh -n "$file" || exit; done
      - name: Regression fixtures
        run: sh tests/run.sh
      - name: Shell lint
        run: shellcheck -x --shell sh ./*.sh lib/*.sh tests/*.sh
      - name: Bcrypt round trips
        run: /usr/bin/python3 tests/auth.py
      - name: Compose validation
        run: |
          cp .env.example .env
          sh traefik.sh validate
          printf 'DASHBOARD_HOSTNAME=dashboard.example.com\nCERTS_EXPORT=true\n' >> .env
          sh traefik.sh validate
